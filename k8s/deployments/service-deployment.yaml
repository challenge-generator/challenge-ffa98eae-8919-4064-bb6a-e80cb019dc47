apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-platform-service
  namespace: default
  labels:
    app: container-platform-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: container-platform-service
  template:
    metadata:
      labels:
        app: container-platform-service
        version: v1
    spec:
      containers:
        - name: container-platform-service
          image: container-platform-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: service-configmap
                  key: PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
---