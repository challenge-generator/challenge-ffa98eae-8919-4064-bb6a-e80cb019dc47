apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: container-platform-service-hpa
  namespace: default
  labels:
    app: container-platform-service
    component: autoscaling
spec:
  # Referencia al deployment que será escalado
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: container-platform-service
  
  # Configuración de escalamiento
  minReplicas: 2
  maxReplicas: 10
  
  # Métricas para el escalamiento automático
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Escalar cuando el uso de CPU supere el 70%
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Escalar cuando el uso de memoria supere el 80%
          averageUtilization: 80
  
  # Comportamiento del escalamiento
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max